name: Release

# Create a GitHub release with a plain tag (e.g. 0.1.0) whose version matches VERSION in
# web/doublesubs.js and <Version> in the .csproj. This builds the plugin, attaches the zip, and adds
# the version to manifest.json (the plugin repository users add in Jellyfin) on the default branch.

on:
  release:
    types: [created]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      ASSET: double-subs_${{ github.event.release.tag_name }}.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: node test/check.mjs

      - name: Check the tag matches both versions
        run: |
          grep -qF "const VERSION = '$TAG';" web/doublesubs.js
          grep -qF "<Version>$TAG</Version>" Jellyfin.Plugin.DoubleSubs/Jellyfin.Plugin.DoubleSubs.csproj

      - name: Build
        run: |
          dotnet publish Jellyfin.Plugin.DoubleSubs -c Release -o out
          (cd out && zip "../$ASSET" Jellyfin.Plugin.DoubleSubs.dll)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

      - name: Add the version to manifest.json
        env:
          CHANGELOG: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          node -e '
            const fs = require("fs"), crypto = require("crypto"), { TAG, ASSET, REPO, CHANGELOG } = process.env;
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const plugin = manifest[0];
            plugin.versions = plugin.versions.filter(v => v.version !== `${TAG}.0`);
            plugin.versions.unshift({
              version: `${TAG}.0`,
              changelog: CHANGELOG || "",
              targetAbi: "12.4.0.0",
              sourceUrl: `https://github.com/${REPO}/releases/download/${TAG}/${ASSET}`,
              checksum: crypto.createHash("md5").update(fs.readFileSync(ASSET)).digest("hex"),
              timestamp: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
            });
            fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add $TAG to the plugin manifest"
          git push origin "$BRANCH"
